<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificado — 38º Seminário IPBM</title>
<style>:root{--navy:#06192d;--navy2:#102e4b;--gold:#d2ad51;--ink:#182235;--muted:#667386;--line:#dce3ea;--ok:#257347;--danger:#a12f2f}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f3f6f8;color:var(--ink)}.wrap{max-width:720px;margin:50px auto;padding:0 20px}.head{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:26px;border-radius:4px 4px 0 0}.head .gold{color:#f0d27c;font-size:10px;letter-spacing:.15em;font-weight:800}.head h1{font-family:Georgia,serif;font-size:29px;line-height:1.12;margin:9px 0 0}.card{background:#fff;border:1px solid var(--line);padding:28px;box-shadow:0 12px 30px rgba(5,25,45,.07)}label{display:block;font-size:12px;font-weight:800;margin-bottom:14px}input{width:100%;height:44px;border:1px solid var(--line);padding:0 11px;font:inherit;margin-top:6px;border-radius:3px}button{height:44px;border:0;background:var(--gold);color:#07192c;padding:0 18px;border-radius:3px;font-weight:800;cursor:pointer}.msg{margin:15px 0;padding:12px;border:1px solid var(--line);font-size:12px;display:none}.msg.show{display:block}.msg.ok{background:#f1faf5;border-color:#b9ddc8;color:var(--ok)}.msg.err{background:#fff5f5;border-color:#ebc5c5;color:var(--danger)}.result{margin-top:22px}.result h2{font-family:Georgia,serif;margin:0 0 8px}.result p{color:var(--muted);font-size:13px}.hidden{display:none}.download{display:inline-flex;align-items:center;justify-content:center;margin-top:14px;background:var(--navy);color:#fff;height:44px;padding:0 18px;border-radius:3px;font-weight:800;text-decoration:none;font-size:12px}@media(max-width:620px){.wrap{margin:20px auto;padding:0 12px}.head h1{font-size:24px}}
</style></head><body><div class="wrap"><div class="head"><div class="gold">INSTITUTO DE PESQUISA DA BRIGADA MILITAR</div><h1>Certificado de Participação</h1></div><div class="card"><p>O certificado só poderá ser emitido após a confirmação da participação pela organização.</p><label>Protocolo<input id="protocol" placeholder="Ex.: IPBM-20261027-0001"></label><label>E-mail da inscrição<input id="email" type="email" placeholder="seu@email.com"></label><button onclick="consult()">Consultar certificado</button><div id="msg" class="msg"></div><div id="result" class="result hidden"></div></div></div>
<script>
function show(text,cls){const e=document.getElementById('msg');e.textContent=text;e.className='msg show '+cls}
function consult(){const protocol=document.getElementById('protocol').value.trim(),email=document.getElementById('email').value.trim();document.getElementById('result').className='result hidden';if(!protocol||!email)return show('Informe o protocolo e o e-mail usados na inscrição.','err');show('Consultando...','ok');google.script.run.withSuccessHandler(d=>{document.getElementById('msg').className='msg';if(!d||!d.ok)return show(d?.message||'Não foi possível consultar o certificado.','err');const r=document.getElementById('result');r.className='result';r.innerHTML='<h2>'+escapeHtml(d.nome)+'</h2><p>'+escapeHtml(d.message)+'</p><a href="#" class="download" onclick="generate(event)">Gerar certificado em PDF</a>';window.current={protocol:protocol,email:email}}).withFailureHandler(()=>show('Erro ao consultar o certificado.','err')).getCertificateStatus(protocol,email)}
function generate(ev){ev.preventDefault();const d=window.current;show('Gerando PDF...','ok');google.script.run.withSuccessHandler(r=>{if(!r||!r.ok)return show(r?.message||'Não foi possível gerar o certificado.','err');const bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=r.filename||'certificado-ipbm.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);show('Certificado gerado.','ok')}).withFailureHandler(()=>show('Erro ao gerar o PDF.','err')).generateCertificate(d.protocol,d.email)}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
